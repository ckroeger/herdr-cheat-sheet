<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Herdr Cheat Sheet</title><link rel="stylesheet" href="assets/style.css"></head>
<body><div class="wrap">
<header><h1 id="title"></h1><nav><span class="lang" id="lang"></span><a class="btn primary" id="gameLink" href="game.html"></a></nav></header>
<p class="sub" id="sub"></p>
<div class="note" id="note"></div>
<input type="search" id="q">
<div class="grid" id="grid"></div>
<footer id="foot"></footer>
</div>
<script src="assets/keys.js"></script><script src="assets/i18n.js"></script>
<script>
const $=id=>document.getElementById(id), upd=langButtons($("lang"));
function render(){
  upd(); document.title=t("title");
  $("title").textContent=t("title"); $("sub").textContent=t("sub");
  $("note").innerHTML="<b>"+t("prefixNote")+":</b> <kbd>"+(lang==="de"?"Strg+B":"Ctrl+B")+"</kbd> — "+t("prefixText");
  $("q").placeholder=t("search"); $("gameLink").textContent="🎮 "+t("game");
  $("foot").textContent=t("footer");
  const f=$("q").value.toLowerCase();
  $("grid").innerHTML=HERDR.groups.map(g=>{
    const rows=g.items.filter(i=>!f||(i.en+" "+i.de+" "+i.k).toLowerCase().includes(f));
    if(!rows.length) return "";
    return '<section class="card"><h2>'+g[lang]+"</h2>"+rows.map(i=>'<div class="row"><span>'+i[lang]+'</span><span class="keys">'+kbdHtml(g,i)+"</span></div>").join("")+"</section>";
  }).join("");
}
window.onLang=render; $("q").oninput=render; render();
</script></body></html>
